<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kugelbuch</title>
  <meta name="description" content="Trainingstagebuch für Kugelhantel und Körpergewicht">
  <meta name="theme-color" content="#E4E7EA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121518" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="appbar">
    <h1 id="title">Kugelbuch</h1>
    <div id="appbar-extra"></div>
  </header>

  <main id="view" tabindex="-1"></main>

  <div id="restbar" class="restbar" hidden></div>

  <nav class="tabs" aria-label="Bereiche">
    <button data-tab="training" aria-label="Training">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 9.2A3.6 3.6 0 0 1 8 7.5a4 4 0 0 1 8 0c0 .6-.2 1.2-.5 1.7"/><circle cx="12" cy="14.5" r="6"/></svg>
      <span>Training</span>
    </button>
    <button data-tab="verlauf" aria-label="Verlauf">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
      <span>Verlauf</span>
    </button>
    <button data-tab="auswertung" aria-label="Auswertung">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M10 20V6M15 20v-9M20 20V4"/></svg>
      <span>Auswertung</span>
    </button>
    <button data-tab="uebungen" aria-label="Übungen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></svg>
      <span>Übungen</span>
    </button>
    <button data-tab="daten" aria-label="Daten und Einstellungen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>
      <span>Daten</span>
    </button>
  </nav>

  <div id="timer" class="timer" hidden></div>
  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
